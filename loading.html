<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
  <title>ADYX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 2;
    }

    /* ── Logo ── */
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 32px;
      background: #fff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
      color: #000;
      letter-spacing: -2px;
      animation: logoPulse 2s ease-in-out infinite;
      box-shadow:
        0 0 40px rgba(255, 255, 255, 0.1),
        0 0 80px rgba(255, 255, 255, 0.05);
    }

    @keyframes logoPulse {

      0%,
      100% {
        transform: scale(1);
        box-shadow:
          0 0 40px rgba(255, 255, 255, 0.1),
          0 0 80px rgba(255, 255, 255, 0.05);
      }

      50% {
        transform: scale(1.05);
        box-shadow:
          0 0 60px rgba(255, 255, 255, 0.15),
          0 0 120px rgba(255, 255, 255, 0.08);
      }
    }

    .app-name {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 8px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .app-tagline {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    /* ── Spinner ── */
    .spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto 24px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Status Text ── */
    #status-text {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 1px;
      margin-bottom: 6px;
      transition: color 0.3s;
    }

    #status-sub {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 0.5px;
      max-width: 300px;
      margin: 0 auto;
    }

    /* ── Retry Button ── */
    #retry-btn {
      display: none;
      margin-top: 24px;
      padding: 10px 28px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: transform 0.15s, opacity 0.15s;
    }

    #retry-btn:hover {
      transform: scale(1.04);
      opacity: 0.9;
    }

    /* ── Background Grain ── */
    .bg-grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    /* ── Subtle radial glow ── */
    .bg-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="bg-grain"></div>
  <div class="bg-glow"></div>

  <div class="container">
    <div class="logo">A</div>
    <div class="app-name">ADYX</div>
    <div class="app-tagline">Anonymous Communication</div>
    <div class="spinner"></div>
    <div id="status-text">Connecting securely...</div>
    <div id="status-sub">Establishing encrypted connection</div>
    <button id="retry-btn">Retry Connection</button>
  </div>

  <script>
    // Check if we were redirected here after a load failure
    const params = new URLSearchParams(window.location.search);
    const hasError = params.get('error') === 'true';

    if (hasError) {
      document.getElementById('status-text').textContent = 'Connection failed';
      document.getElementById('status-sub').textContent =
        'Could not load the ADYX interface. The internal server may have failed to start.';
      document.getElementById('retry-btn').style.display = 'inline-block';
      document.querySelector('.spinner').style.display = 'none';
    } else {
      // Animate status text while connecting
      const statuses = [
        'Connecting securely...',
        'Initializing encryption...',
        'Loading interface...'
      ];
      let i = 0;
      setInterval(() => {
        i = (i + 1) % statuses.length;
        const el = document.getElementById('status-text');
        if (el) el.textContent = statuses[i];
      }, 2000);
    }

    // Retry button — single handler, uses IPC to tell main process to retry
    document.getElementById('retry-btn').addEventListener('click', () => {
      document.getElementById('status-text').textContent = 'Retrying...';
      document.getElementById('status-sub').textContent = 'Attempting to reconnect';
      document.getElementById('retry-btn').style.display = 'none';
      document.querySelector('.spinner').style.display = 'block';
      // Send IPC to main process to retry
      if (window.adyxDesktop && window.adyxDesktop.retry) {
        window.adyxDesktop.retry();
      } else {
        // Fallback: reload to trigger the main process flow again
        window.location.href = window.location.pathname;
      }
    });
  </script>
</body>

</html>
